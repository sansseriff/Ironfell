[package]
name = "iron-native"
version = "0.0.1"
edition = "2024"
description = "Iron's macOS native host feasibility experiment"
default-run = "iron-native"

[[bin]]
name = "iron-native-probe"
path = "src/probe.rs"
required-features = ["composition-probe"]

[dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }
tauri = { version = "2", features = ["macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
ironfell = { path = "..", features = ["native"] }
iron_document = { path = "../src/iron_document" }
iron_text = { path = "../src/iron_text", features = ["system"] }
raw-window-handle = "0.6"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSRunLoop"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
composition-probe = []
