name: Deploy backend comparison to GitHub Pages

run-name: Classic / Hybrid / Hybrid-only / Bevy-only (${{ inputs.bevy_only_ref }})

on:
  workflow_dispatch:
    inputs:
      classic_ref:
        description: Git ref for the currently deployed Classic build
        required: true
        default: v0.0.33
        type: string
      hybrid_ref:
        description: Git ref for the Hybrid build
        required: true
        default: bevy-0.19-upgrade
        type: string
      hybrid_only_ref:
        description: Git ref for the Hybrid-only build without bevy_vello
        required: true
        default: hybrid-only-startup
        type: string
      bevy_only_ref:
        description: Git ref for the Bevy-only build without any Vello renderer
        required: true
        default: bevy-only-startup
        type: string

# The workflow must be dispatched from master, which is already allowed to use
# the github-pages environment. The application refs above are checkout inputs;
# this lets us test a feature branch without granting every branch permission to
# replace the production Pages site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Classic source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.classic_ref }}
          path: classic
          submodules: recursive
          persist-credentials: false

      - name: Checkout Hybrid source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.hybrid_ref }}
          path: hybrid
          submodules: recursive
          persist-credentials: false

      - name: Checkout Hybrid-only source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.hybrid_only_ref }}
          path: hybrid-only
          submodules: recursive
          persist-credentials: false

      - name: Checkout Bevy-only source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bevy_only_ref }}
          path: bevy-only
          submodules: recursive
          persist-credentials: false

      # Each checkout pins its own Rust nightly. Running rustup from inside both
      # trees installs exactly the toolchains and wasm target their builds need.
      - name: Setup Rust toolchains
        run: |
          (cd classic && rustup show)
          (cd hybrid && rustup show)
          (cd hybrid-only && rustup show)
          (cd bevy-only && rustup show)

      # wasm-bindgen's CLI schema must exactly match the crate. The current refs
      # use 0.2.126; fail clearly if future input refs do not match.
      - name: Read wasm-bindgen version
        id: wasm_bindgen_version
        run: |
          classic_version=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2}' classic/Cargo.lock)
          hybrid_version=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2}' hybrid/Cargo.lock)
          hybrid_only_version=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2}' hybrid-only/Cargo.lock)
          bevy_only_version=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2}' bevy-only/Cargo.lock)
          if [ "$classic_version" != "$hybrid_version" ] || \
             [ "$classic_version" != "$hybrid_only_version" ] || \
             [ "$classic_version" != "$bevy_only_version" ]; then
            echo "wasm-bindgen versions differ: Classic=$classic_version Hybrid=$hybrid_version Hybrid-only=$hybrid_only_version Bevy-only=$bevy_only_version" >&2
            exit 1
          fi
          echo "version=$classic_version" >> "$GITHUB_OUTPUT"

      - name: Setup wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: ${{ steps.wasm_bindgen_version.outputs.version }}

      - name: Install wasm-opt
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz | tar xz
          sudo cp binaryen-version_116/bin/wasm-opt /usr/local/bin/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build Classic at the site root
        working-directory: classic
        run: |
          mkdir -p opt src-ui/wasm
          sh ./build-wasm.sh
          bun install
          bun run build

      - name: Build Hybrid under /hybrid/
        working-directory: hybrid
        run: |
          mkdir -p opt src-ui/wasm
          sh ./build-wasm.sh
          bun install
          bun run build -- --base /Ironfell/hybrid/

      - name: Build Hybrid-only under /hybrid-only/
        working-directory: hybrid-only
        run: |
          mkdir -p opt src-ui/wasm
          sh ./build-wasm.sh
          bun install
          bun run build -- --base /Ironfell/hybrid-only/

      - name: Build Bevy-only under /bevy-only/
        working-directory: bevy-only
        run: |
          mkdir -p opt src-ui/wasm
          sh ./build-wasm.sh
          bun install
          bun run build -- --base /Ironfell/bevy-only/

      - name: Assemble comparison site
        env:
          CLASSIC_REF: ${{ inputs.classic_ref }}
          HYBRID_REF: ${{ inputs.hybrid_ref }}
          HYBRID_ONLY_REF: ${{ inputs.hybrid_only_ref }}
          BEVY_ONLY_REF: ${{ inputs.bevy_only_ref }}
        run: |
          mkdir -p site/hybrid site/hybrid-only site/bevy-only
          cp -a classic/dist/. site/
          cp -a hybrid/dist/. site/hybrid/
          cp -a hybrid-only/dist/. site/hybrid-only/
          cp -a bevy-only/dist/. site/bevy-only/
          classic_sha=$(git -C classic rev-parse HEAD)
          hybrid_sha=$(git -C hybrid rev-parse HEAD)
          hybrid_only_sha=$(git -C hybrid-only rev-parse HEAD)
          bevy_only_sha=$(git -C bevy-only rev-parse HEAD)
          printf 'classic_ref=%s\nclassic_sha=%s\nhybrid_ref=%s\nhybrid_sha=%s\nhybrid_only_ref=%s\nhybrid_only_sha=%s\nbevy_only_ref=%s\nbevy_only_sha=%s\n' \
            "$CLASSIC_REF" "$classic_sha" \
            "$HYBRID_REF" "$hybrid_sha" \
            "$HYBRID_ONLY_REF" "$hybrid_only_sha" \
            "$BEVY_ONLY_REF" "$bevy_only_sha" \
            > site/comparison-build.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy comparison site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Publish comparison links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CLASSIC_REF: ${{ inputs.classic_ref }}
          HYBRID_REF: ${{ inputs.hybrid_ref }}
          HYBRID_ONLY_REF: ${{ inputs.hybrid_only_ref }}
          BEVY_ONLY_REF: ${{ inputs.bevy_only_ref }}
        run: |
          {
            echo "### Backend comparison deployed"
            echo
            echo "- Classic ($CLASSIC_REF): [$PAGE_URL]($PAGE_URL)"
            echo "- Hybrid ($HYBRID_REF): [${PAGE_URL}hybrid/](${PAGE_URL}hybrid/)"
            echo "- Hybrid-only ($HYBRID_ONLY_REF): [${PAGE_URL}hybrid-only/](${PAGE_URL}hybrid-only/)"
            echo "- Bevy-only ($BEVY_ONLY_REF): [${PAGE_URL}bevy-only/](${PAGE_URL}bevy-only/)"
            echo "- Build identity: [${PAGE_URL}comparison-build.txt](${PAGE_URL}comparison-build.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
