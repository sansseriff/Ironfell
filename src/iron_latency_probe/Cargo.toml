[package]
name = "iron-latency-probe"
version = "0.0.1"
edition = "2024"
description = "Standalone Bevy/winit pointer latency control"

[dependencies]
bevy = { version = "0.20", features = [
    "bevy_winit",
    "multi_threaded",
    "std",

    "bevy_pbr",
    "bevy_gizmos",
    # Without it gizmos are recorded but never drawn: 3D selection outlines.
    "bevy_gizmos_render",
    "tonemapping_luts",
    "bevy_window",
    "bevy_log",
    # The view composites are `Material2d`s. No `bevy_ui`/`bevy_text`: the
    # Stats composition replaced the UI overlay (free-running.md §4).
    "bevy_sprite_render",
    "bevy_image",
    "png",
    "jpeg",
    "bevy_render",
    "bevy_scene",
    "bevy_gltf",
    "bevy_picking",
    # bevy 0.18 no longer picks a zstd backend for you (used by KTX2/basis textures).
    # zstd_rust is the pure-Rust one — no C toolchain needed for the wasm build.
    "zstd_rust",
], default-features = false }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

# Separate workspace: the winit feature must not unify into Iron's Tauri host.
[workspace]

# Match the host's comparison profile; keep its dependency cache reusable.
[profile.dev-opt]
inherits = "release"
debug-assertions = false
opt-level = 1
lto = false
codegen-units = 256
debug = true
overflow-checks = true
