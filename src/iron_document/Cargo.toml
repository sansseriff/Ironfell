[package]
name = "iron_document"
version = "0.1.0"
edition = "2024"
description = "The authored store: identity-stable nodes, operations, history, and views. Depends on nothing renderer-shaped."
# The integration tests are modules of one binary (`tests/suite.rs`), not a
# binary per file: a change relinks one test executable instead of ~60.
autotests = false

[[test]]
name = "suite"
path = "tests/suite.rs"

# Binaries of their own, for state the whole process shares: the tests that
# register real fonts, and a counting global allocator.
[[test]]
name = "fonts"
path = "tests/fonts.rs"

[[test]]
name = "instance_cost"
path = "tests/instance_cost.rs"

# No Bevy, by design (plans/specs/document-spine.md §5). This crate compiles and
# tests natively; the app crate wraps it in a resource and owns the reconciler.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The constraint solver (plans/specs/constraint-system.md §5); pure, no Bevy.
iron_solve = { path = "../iron_solve" }
# Shape outlines (`shape`): the renderer and a shape's conversion to a path
# share one geometry. Pure, no Bevy; the app already uses this version.
kurbo = "0.13.1"
# Text layout for text nodes' bounds (plans/specs/text.md); Bevy-free.
iron_text = { path = "../iron_text" }
# Stacks and grids on groups (plans/specs/layout-and-tables.md); Bevy-free.
iron_layout = { path = "../iron_layout" }

[features]
# The differential harness (plans/archive/handoff-reactive-structure.md §4.1): `Store`
# becomes a facade over two stores compared after every call, so every test
# is a differential script. Test-only; the app never enables it.
differential = []
# The reference for the cells on structural keys (plans/specs/structure-in-the-graph.md
# §3.5): after every facade call, each keyed layout laid out again from the store and
# compared with its native's claims. Test-only.
structure-oracle = ["differential"]
# Work counted at whole-document choke points (`work.rs`), for the scaling test
# (plans/handoff-scaling.md §5). Test-only.
work = []

[dev-dependencies]
# Only for the test that pins `geom::world_affine` to Bevy's own transform
# arithmetic. Same version as bevy_math's, so the comparison is exact.
glam = "0.32"
