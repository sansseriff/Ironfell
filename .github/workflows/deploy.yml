name: Deploy to GitHub Pages

on:
  # Run only when a tag is pushed
  push:
    tags:
      - "v*" # Matches tags that start with v, like v1.0.0
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Removed the Setup Pages step as it's not required and causing errors

      # rust-toolchain.toml is the single source of truth for the toolchain, its
      # components (rust-src, needed by -Z build-std) and the wasm32 target — same
      # philosophy as the wasm-bindgen/Cargo.lock sync below. `rustup show` reads
      # that file and installs exactly what it names, so bumping the toolchain is a
      # one-line edit there with nothing to keep in sync here.
      # (The old actions-rs/toolchain action is archived and pinned the version a
      # second time, so it has been dropped.)
      - name: Setup Rust
        run: rustup show

      # Cargo.lock is the single source of truth for the wasm-bindgen version.
      # Derive the CLI version from it so the runner always matches the crate the
      # project is locked to — bumping is just `cargo update` + committing the lock.
      - name: Read wasm-bindgen version from Cargo.lock
        id: wasm_bindgen_version
        run: echo "version=$(awk -F'\"' '/^name = \"wasm-bindgen\"$/{getline; print $2}' Cargo.lock)" >> "$GITHUB_OUTPUT"

      - name: Setup wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: ${{ steps.wasm_bindgen_version.outputs.version }}

      - name: Install wasm-opt
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz | tar xz
          sudo cp binaryen-version_116/bin/wasm-opt /usr/local/bin/

      - name: Create directories
        run: |
          mkdir -p opt
          mkdir -p src-ui/wasm

      # Both graphics targets, because the frontend imports both artifacts
      # statically and picks one at runtime (see runtime/backend_policy.ts).
      # Building only one fails the vite build on an unresolved import rather
      # than silently shipping a half-working site.
      # WebGPU carries Vello Classic as a second selectable renderer; WebGL2
      # cannot, since classic flattens paths in compute shaders.
      - name: Build WASM (both graphics targets)
        run: |
          sh ./build-wasm.sh webgpu classic
          sh ./build-wasm.sh webgl2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
