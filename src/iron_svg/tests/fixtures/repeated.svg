<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300">
  <defs>
    <g id="leaf">
      <path d="M0 0 C10 -20 30 -20 40 0 C30 20 10 20 0 0 Z" fill="#2a7"/>
      <path d="M0 0 L40 0" stroke="#164" stroke-width="2" fill="none"/>
      <circle cx="40" cy="0" r="3" fill="#164"/>
    </g>
    <g id="petal">
      <ellipse cx="0" cy="-12" rx="5" ry="12" fill="#e6a"/>
      <ellipse cx="0" cy="-12" rx="2" ry="8" fill="#fce"/>
    </g>
    <g id="flower">
      <use xlink:href="#petal"/>
      <use xlink:href="#petal" transform="rotate(180)"/>
      <circle r="4" fill="#fc3"/>
    </g>
  </defs>
  <use id="l1" xlink:href="#leaf" transform="translate(50 50)"/>
  <use id="l2" xlink:href="#leaf" transform="translate(150 50) scale(-1 1)"/>
  <use id="l3" xlink:href="#leaf" transform="translate(250 80) rotate(30)"/>
  <use id="f1" xlink:href="#flower" transform="translate(100 200)"/>
  <use id="f2" xlink:href="#flower" transform="translate(300 200) scale(1.5)"/>
</svg>
