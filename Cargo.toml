# Opt-in for `panic = "immediate-abort"` in [profile.wasm-release] (nightly-only).
cargo-features = ["panic-immediate-abort"]

[workspace]
members = [".", "src/bevy_remote_inspector"]


[workspace.dependencies]
bevy = { version = "0.18", features = [
    "std",
    "bevy_pbr",
    "bevy_gizmos",
    "tonemapping_luts",
    "webgpu",
    "bevy_window",
    "bevy_log",
    "bevy_text",
    "bevy_ui",
    "default_font",
    "bevy_image",
    "png",
    "jpeg",
    "bevy_render",
    "bevy_scene",
    "bevy_gltf",
    "bevy_picking",
    # bevy 0.18 no longer picks a zstd backend for you (used by KTX2/basis textures).
    # zstd_rust is the pure-Rust one — no C toolchain needed for the wasm build.
    "zstd_rust",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[package]
name = "ironfell"
description = "bringing science to life"
authors = ["Andrew Mueller"]
version = "0.0.1"
edition = "2024"
# rust-version = "1.78"

[lib]
crate-type = ["cdylib"]

[dependencies]
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log = { version = "*", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
bevy_remote_inspector = { path = "./src/bevy_remote_inspector" }
bevy_vello = "0.13.1"

# Pin app-surface: it must resolve to the SAME wgpu major as bevy_render, or the
# two end up with incompatible wgpu types. bevy 0.18 -> wgpu 27, and app-surface
# 1.8.x is the last release on wgpu ^27 (1.9+ moved to 28, 1.13 to 30).
app-surface = { version = "=1.8.1", features = ["web_rwh"] }
raw-window-handle = "0.6"
wgpu = "27"
# Web only
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.51"
console_error_panic_hook = "0.1.7"
console_log = "1"
web-sys = { version = "0.3.78", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "OffscreenCanvas",
    "MouseEvent",
    "Worker",
    "DedicatedWorkerGlobalScope",
    "Event",
    "MessageEvent",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Request",
    "RequestInit",
    "Response",
] }
js-sys = "0.3.78"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
# `panic_immediate_abort` used to be a -Z build-std-features flag; newer nightlies
# promoted it to a real panic strategy, so it is selected here instead. Still
# requires -Z build-std (see build-wasm.sh) to rebuild core with it.
panic = "immediate-abort"
codegen-units = 1
incremental = false
debug = false
strip = true


# works
[profile.dev-opt]
inherits = "release"
debug-assertions = false # breaks build if true
opt-level = 1
lto = false
codegen-units = 256
debug = true
overflow-checks = true
