name: Deploy a ref to GitHub Pages

run-name: Deploy ${{ inputs.app_ref }}${{ inputs.include_legacy_classic && ' + legacy classic' || '' }}

# One ref, one app, every backend combination reachable by URL.
#
# This workflow used to check out five branches and build five sites, because a
# branch was the only way to express a renderer or graphics-API choice. Both are
# now cargo features on one source tree, and the app selects its backend at
# runtime, so the whole comparison matrix collapses into a single deploy:
#
#   /                            automatic selection (what users get)
#   /?gfx=webgpu                 WebGPU + Vello Hybrid
#   /?gfx=webgpu&bevy=classic    WebGPU + Vello Classic
#   /?gfx=webgl2                 WebGL2 + Vello Hybrid
#
# Combine with the perf-grid variants as before, e.g.
# `?gfx=webgl2&bevy=alpha` or `?gfx=webgpu&bevy=classic,nolog`.
#
# The one cell this cannot reproduce is the pre-0.19 app, which is a different
# bevy and a different bevy_vello. It can be deployed alongside for historical
# reference, but note it differs in engine version as well as renderer, so it is
# not a controlled comparison against anything above.

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Git ref to build and deploy
        required: true
        default: dual-target
        type: string
      include_legacy_classic:
        description: Also deploy the pre-0.19 Vello Classic app under /legacy-classic/
        required: false
        default: false
        type: boolean
      legacy_classic_ref:
        description: Git ref for that legacy build
        required: false
        default: v0.0.33
        type: string

# The workflow must be dispatched from master, which is already allowed to use
# the github-pages environment. The application refs above are checkout inputs;
# this lets us deploy a feature branch without granting every branch permission
# to replace the production Pages site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref }}
          path: app
          submodules: recursive
          persist-credentials: false

      - name: Checkout legacy classic source
        if: ${{ inputs.include_legacy_classic }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.legacy_classic_ref }}
          path: legacy-classic
          submodules: recursive
          persist-credentials: false

      # Each checkout pins its own Rust nightly. Running rustup from inside the
      # trees installs exactly the toolchains and wasm target their builds need.
      - name: Setup Rust toolchains
        run: |
          (cd app && rustup show)
          if [ -d legacy-classic ]; then (cd legacy-classic && rustup show); fi

      # wasm-bindgen's CLI schema must exactly match the crate. Derive the
      # version from the lockfile, and fail clearly if a second checkout
      # disagrees rather than emitting bindings that will not load.
      - name: Read wasm-bindgen version
        id: wasm_bindgen_version
        run: |
          app_version=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2}' app/Cargo.lock)
          if [ -d legacy-classic ]; then
            legacy_version=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2}' legacy-classic/Cargo.lock)
            if [ "$app_version" != "$legacy_version" ]; then
              echo "wasm-bindgen versions differ: app=$app_version legacy=$legacy_version" >&2
              exit 1
            fi
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Setup wasm-bindgen
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: ${{ steps.wasm_bindgen_version.outputs.version }}

      - name: Install wasm-opt
        run: |
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz | tar xz
          sudo cp binaryen-version_116/bin/wasm-opt /usr/local/bin/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # Both graphics targets: the frontend imports both artifacts statically and
      # chooses at runtime, so building one would fail the vite build on an
      # unresolved import. WebGPU carries Vello Classic as a second selectable
      # renderer; WebGL2 cannot, as classic needs compute shaders.
      - name: Build the app at the site root
        working-directory: app
        run: |
          mkdir -p opt src-ui/wasm
          sh ./build-wasm.sh webgpu classic
          sh ./build-wasm.sh webgl2
          bun install
          bun run build

      - name: Build legacy classic under /legacy-classic/
        if: ${{ inputs.include_legacy_classic }}
        working-directory: legacy-classic
        run: |
          mkdir -p opt src-ui/wasm
          sh ./build-wasm.sh
          bun install
          bun run build -- --base /Ironfell/legacy-classic/

      - name: Assemble site
        env:
          APP_REF: ${{ inputs.app_ref }}
          LEGACY_REF: ${{ inputs.legacy_classic_ref }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy_classic }}
        run: |
          mkdir -p site
          cp -a app/dist/. site/
          app_sha=$(git -C app rev-parse HEAD)
          printf 'app_ref=%s\napp_sha=%s\n' "$APP_REF" "$app_sha" > site/comparison-build.txt
          if [ "$INCLUDE_LEGACY" = "true" ]; then
            mkdir -p site/legacy-classic
            cp -a legacy-classic/dist/. site/legacy-classic/
            legacy_sha=$(git -C legacy-classic rev-parse HEAD)
            printf 'legacy_classic_ref=%s\nlegacy_classic_sha=%s\n' \
              "$LEGACY_REF" "$legacy_sha" >> site/comparison-build.txt
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages

  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Publish links
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          APP_REF: ${{ inputs.app_ref }}
          LEGACY_REF: ${{ inputs.legacy_classic_ref }}
          INCLUDE_LEGACY: ${{ inputs.include_legacy_classic }}
        run: |
          {
            echo "### Deployed $APP_REF"
            echo
            echo "| Cell | URL |"
            echo "| --- | --- |"
            echo "| Automatic (what users get) | [${PAGE_URL}](${PAGE_URL}) |"
            echo "| WebGPU + Vello Hybrid | [${PAGE_URL}?gfx=webgpu](${PAGE_URL}?gfx=webgpu) |"
            echo "| WebGPU + Vello Classic | [${PAGE_URL}?gfx=webgpu&bevy=classic](${PAGE_URL}?gfx=webgpu&bevy=classic) |"
            echo "| WebGL2 + Vello Hybrid | [${PAGE_URL}?gfx=webgl2](${PAGE_URL}?gfx=webgl2) |"
            if [ "$INCLUDE_LEGACY" = "true" ]; then
              echo "| Legacy classic ($LEGACY_REF) — different bevy, not a controlled comparison | [${PAGE_URL}legacy-classic/](${PAGE_URL}legacy-classic/) |"
            fi
            echo
            echo "Build identity: [${PAGE_URL}comparison-build.txt](${PAGE_URL}comparison-build.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
